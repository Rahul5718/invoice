<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Portal — Invoicely</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-card">
    <!-- Header with Branding -->
    <div class="auth-header">
      <div class="brand-badge">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
      </div>
      <h1 id="auth-title">Welcome Back</h1>
      <p id="auth-subtitle">Sign in to manage and dispatch your invoices.</p>
    </div>

    <!-- Toggle Switch -->
    <div class="toggle-container">
      <button type="button" class="toggle-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button type="button" class="toggle-btn" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Feedback Message Box -->
    <div id="alert-box" class="alert-box" style="display: none;"></div>

    <!-- Login Form -->
    <form id="login-form" class="auth-form">
      <div class="form-group">
        <label for="login-email">Work Email</label>
        <input type="email" id="login-email" placeholder="alex@studio.com" required>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="login-password">Password</label>
          <a href="#" class="forgot-link" onclick="handleForgotPassword(event)">Forgot?</a>
        </div>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>

    <!-- Registration Form -->
    <form id="register-form" class="auth-form" style="display: none;">
      <div class="form-group">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" placeholder="Alex Rivera" required>
      </div>

      <div class="form-group">
        <label for="reg-business">Studio / Company Name</label>
        <input type="text" id="reg-business" placeholder="Rivera Digital Studio">
      </div>

      <div class="form-group">
        <label for="reg-email">Work Email</label>
        <input type="email" id="reg-email" placeholder="alex@studio.com" required>
      </div>

      <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" placeholder="At least 6 characters" minlength="6" required>
      </div>

      <button type="submit" class="btn btn-primary">Create Free Account</button>
    </form>

    <div class="auth-footer">
      <span id="footer-text">Don't have an account? <a href="#" onclick="switchTab('register'); return false;">Sign up</a></span>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
